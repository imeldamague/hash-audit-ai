
site_name: Hash-Audit AI
site_description: Documentation du prototype multi-agents d'audit du stockage des mots de passe
site_url: https://imeldamague.github.io/hash-audit-ai/
repo_name: imeldamague/hash-audit-ai
repo_url: https://github.com/imeldamague/hash-audit-ai

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Accueil: index.md
  - Projet:
      - Architecture: architecture.md
      - Fonctionnement: fonctionnement.md
      - Résultats: resultats.md
  - Utilisation:
      - Installation: installation.md
  - Sécurité:
      - Sécurité et limites: securite-limites.md
