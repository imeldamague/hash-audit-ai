[project]
name = "hash-audit-ai"
version = "0.1.0"
description = "Educational password-storage audit with six deterministic agents"
requires-python = ">=3.11"
dependencies = ["argon2-cffi>=23.1,<26", "bcrypt>=4,<6", "flask>=3,<4", "pyyaml>=6,<7"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]
[project.scripts]
hash-audit = "hash_audit.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
